<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊計劃規劃 - 檢視模式</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        /* ----- 複用編輯程式的主要樣式，唯讀調整 ----- */
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6b8cbc;
            --accent-color: #ff7e5f;
            --background-color: #f8f9fa;
            --card-color: #ffffff;
            --text-color: #333333;
            --light-text: #666666;
            --border-color: #e0e0e0;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--background-color); color: var(--text-color); line-height: 1.6; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; width: 100%; }
        /* 標題列已完全移除 */
        .itinerary-panel { background-color: var(--card-color); border-radius: var(--border-radius); padding: 25px; box-shadow: var(--shadow); width: 100%; }
        .no-plan-selected { text-align: center; padding: 60px 20px; color: var(--light-text); }
        .no-plan-selected i { font-size: 4rem; color: #e0e0e0; margin-bottom: 20px; }
        .plan-header { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .plan-header h2 { color: var(--primary-color); margin-bottom: 5px; }
        .plan-header p { color: var(--light-text); }
        .days-tabs-container { width: 100%; overflow-x: auto; margin-bottom: 30px; }
        .days-tabs { display: flex; min-width: min-content; }
        .day-tab { padding: 12px 20px; border: 1px solid var(--border-color); background-color: #f9f9f9; border-radius: var(--border-radius) var(--border-radius) 0 0; margin-right: 5px; white-space: nowrap; cursor: default; }
        .day-tab.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
        .cost-tab { background-color: #f0f0f0; color: var(--text-color); }
        .cost-tab.active { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }
        .day-content { display: none; }
        .day-content.active { display: block; }
        .cost-content { display: none; }
        .cost-content.active { display: block; }
        .day-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .day-title { font-size: 1.2rem; font-weight: bold; color: var(--primary-color); margin: 0; }
        .activities-container { min-height: 300px; }
        .activity-item { background-color: #f9f9f9; border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 20px; margin-bottom: 20px; }
        .activity-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; flex-wrap: wrap; }
        .activity-name { font-weight: bold; font-size: 1.2rem; color: var(--primary-color); }
        .activity-category { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-left: 10px; }
        .activity-category.attraction { background-color: #e3f2fd; color: #1565c0; }
        .activity-category.transport { background-color: #f3e5f5; color: #7b1fa2; }
        .activity-category.activity { background-color: #e8f5e9; color: #2e7d32; }
        .activity-category.accommodation { background-color: #fff3e0; color: #ef6c00; }
        .activity-category.shopping { background-color: #fff0f5; color: #c2185b; }
        .activity-category.other { background-color: #f5f5f5; color: #616161; }
        .activity-time { color: var(--light-text); font-size: 0.85rem; }
        .activity-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .activity-address, .activity-cost, .activity-links, .activity-notes { font-size: 0.9rem; word-break: break-word; }
        .activity-links a { color: var(--primary-color); text-decoration: none; margin-right: 10px; }
        .activity-links a:hover { text-decoration: underline; }
        .transport-item { background-color: #f0f7ff; border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 15px; margin-bottom: 15px; margin-left: 30px; position: relative; }
        .transport-item::before { content: "→"; position: absolute; left: -25px; top: 50%; transform: translateY(-50%); color: var(--light-text); }
        .transport-main { border-left: 4px solid #4caf50; }
        .transport-alternate { border-left: 4px solid #ff9800; }
        .cost-summary { margin-top: 40px; background-color: #f9f9f9; border-radius: var(--border-radius); padding: 20px; overflow-x: auto; }
        .cost-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .cost-table th, .cost-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .cost-table th { background-color: #f0f0f0; }
        .total-cost { font-weight: bold; color: var(--accent-color); }
        .cost-total-row { font-weight: bold; background-color: rgba(255, 126, 95, 0.1); }
        .cost-group-header { background-color: #e3f2fd; color: var(--primary-color); font-weight: bold; padding: 10px; margin-top: 15px; border-left: 5px solid var(--primary-color); display: flex; justify-content: space-between; }
        .btn { padding: 8px 16px; border: none; border-radius: var(--border-radius); cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: var(--secondary-color); }
        .btn-accent { background-color: var(--accent-color); color: white; }
        .btn-accent:hover { background-color: #ff6b4a; }
        .btn-map-route { background-color: #0F9D58; color: white; border: none; padding: 4px 12px; font-size: 0.85rem; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; }
        .btn-map-route:hover { background-color: #0b8043; }
        .error-container { text-align: center; padding: 60px; color: var(--danger-color); }
        .back-link { margin-top: 30px; text-align: center; }

        /* ===== 滾動按鈕 ===== */
        .scroll-buttons {
            position: fixed;
            right: clamp(15px, 3vw, 30px);
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 99;
        }
        .scroll-btn {
            width: clamp(40px, 8vw, 50px);
            height: clamp(40px, 8vw, 50px);
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: all 0.3s;
            border: none;
            font-size: 1.2rem;
        }
        .scroll-btn:hover {
            background-color: var(--secondary-color);
            transform: scale(1.1);
        }
        @media (max-width: 1024px) {
            .scroll-buttons { display: none; }
        }
        @media (max-width: 768px) { .container { padding: 15px; } .activity-header { flex-direction: column; } }

        /* ----- 最新版本提示（極簡，不佔空間）----- */
        .version-hint {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <!-- 滾動按鈕 ↑↓ -->
    <div class="scroll-buttons">
        <button class="scroll-btn" id="scrollToTopBtn"><i class="fas fa-chevron-up"></i></button>
        <button class="scroll-btn" id="scrollToBottomBtn"><i class="fas fa-chevron-down"></i></button>
    </div>

    <div class="container">
        <div class="itinerary-panel">
            <div id="loadingIndicator" style="text-align: center; padding: 60px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 3rem; color: var(--primary-color);"></i>
                <p style="margin-top: 20px;">載入分享的旅遊計劃中...</p>
            </div>
            <div id="errorMessage" style="display: none;" class="error-container">
                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 20px;"></i>
                <h2>無法載入計劃</h2>
                <p id="errorDetail"></p>
                <div class="back-link">
                    <button class="btn btn-primary" onclick="window.location.href='EditPlan.html'">
                        前往編輯器
                    </button>
                </div>
            </div>
            <div id="planContent" style="display: none;">
                <!-- 最新版本提示會動態插入此處 -->
                <div id="versionHintContainer" style="min-height: 30px;"></div>
                <div class="plan-header">
                    <h2 id="planName"></h2>
                    <p id="planDates"></p>
                </div>
                <div class="days-tabs-container">
                    <div class="days-tabs" id="daysTabs"></div>
                </div>
                <div id="daysContent"></div>
            </div>
        </div>
    </div>

    <script>
        // ---------- Firebase 初始化 ----------
        const firebaseConfig = {
            apiKey: "AIzaSyAx25sF8HaBVULC4754V4UUS-5i6HtdY_c",
            authDomain: "travelplan-1f122.firebaseapp.com",
            databaseURL: "https://travelplan-1f122-default-rtdb.firebaseio.com",
            projectId: "travelplan-1f122",
            storageBucket: "travelplan-1f122.firebasestorage.app",
            messagingSenderId: "383887445959",
            appId: "1:383887445959:web:af118b60a90fb42fc453e2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const VERSIONS_NODE = 'plan_versions';

        // ---------- 全域變數 ----------
        let currentPlan = null;
        let currentDay = 1;
        let exchangeRates = { USD: 30.5, JPY: 0.22, EUR: 33.5, CNY: 4.3, KRW: 0.023, HKD: 3.9, GBP: 38.5, TWD: 1 };

        // ---------- 輔助函數 ----------
        function formatDate(date) {
            if (!date) return '';
            const d = new Date(date);
            return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
        }

        function parseTime(timeStr) {
            if (!timeStr) return 0;
            const m = timeStr.match(/^(\d{1,2}):(\d{2})$/);
            return m ? parseInt(m[1])*60 + parseInt(m[2]) : 0;
        }

        // ---------- 滾動按鈕功能 ----------
        document.addEventListener('DOMContentLoaded', function() {
            const topBtn = document.getElementById('scrollToTopBtn');
            const bottomBtn = document.getElementById('scrollToBottomBtn');
            if (topBtn) topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            if (bottomBtn) bottomBtn.addEventListener('click', () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
        });

        // ---------- Google 地圖路線規劃 ----------
        function openDailyMapRoute(day) {
            if (!currentPlan || !currentPlan.activities) return;
            const dayActivities = currentPlan.activities.filter(a => a.day === day);
            if (dayActivities.length === 0) { alert('今日尚無行程'); return; }
            dayActivities.sort((a, b) => parseTime(a.startTime) - parseTime(b.startTime));
            let points = dayActivities.map(a => 
                (a.address && a.address.trim()) ? a.address.trim() : (a.location ? a.location.trim() : '')
            ).filter(p => p !== '');
            if (points.length === 0) { alert('行程中沒有有效的地點或地址'); return; }
            const route = [points[0]];
            for (let i = 1; i < points.length; i++) {
                if (points[i] !== route[route.length - 1]) route.push(points[i]);
            }
            const base = "https://www.google.com/maps/dir/";
            const url = base + route.map(loc => encodeURIComponent(loc)).join('/');
            window.open(url, '_blank');
        }

        // ---------- 🔍 查詢同一計劃的最新版本 ----------
        async function findLatestVersionByPlanId(planId, currentVersionId) {
            try {
                const snapshot = await db.ref(VERSIONS_NODE)
                    .orderByChild('planId')
                    .equalTo(planId)
                    .once('value');
                
                if (!snapshot.exists()) return null;

                let latestVersion = null;
                let latestTimestamp = 0;

                snapshot.forEach(child => {
                    const ver = child.val();
                    if (ver.timestamp && ver.timestamp > latestTimestamp) {
                        latestTimestamp = ver.timestamp;
                        latestVersion = {
                            versionId: child.key,
                            ...ver
                        };
                    }
                });

                // 如果最新版本的 ID 與目前版本不同，則回傳最新版本
                if (latestVersion && latestVersion.versionId !== currentVersionId) {
                    console.log(`📌 發現更新版本：${latestVersion.versionId.substr(0,8)}，時間戳 ${new Date(latestTimestamp).toLocaleString()}`);
                    return latestVersion;
                }
                return null; // 已是最新
            } catch (error) {
                console.warn('查詢最新版本失敗，將使用原版本', error);
                return null;
            }
        }

        // ---------- 顯示「已為您跳轉至最新版本」提示 ----------
        function showVersionHint(message) {
            const container = document.getElementById('versionHintContainer');
            if (container) {
                container.innerHTML = `<div class="version-hint"><i class="fas fa-cloud-upload-alt"></i> ${message}</div>`;
            }
        }

        // ---------- 載入分享計劃（自動跳轉最新版）----------
        async function loadSharedPlan() {
            const urlParams = new URLSearchParams(window.location.search);
            const versionId = urlParams.get('versionId');
            if (!versionId) {
                showError('缺少分享代碼，無法載入計劃。');
                return;
            }

            try {
                // 1. 先取得原始版本資料
                const snapshot = await db.ref(`${VERSIONS_NODE}/${versionId}`).once('value');
                if (!snapshot.exists()) {
                    showError('找不到對應的旅遊計劃，可能已被刪除。');
                    return;
                }

                const originalData = snapshot.val();
                if (!originalData.planData) {
                    showError('計劃資料格式錯誤。');
                    return;
                }

                // 2. 取得 planId（備份時直接儲存的欄位，若無則從 planData.id 取得）
                const planId = originalData.planId || originalData.planData?.id;
                if (!planId) {
                    console.warn('無法從備份中取得 planId，將使用原始版本');
                }

                let targetData = originalData;
                let targetVersionId = versionId;
                let isLatest = true;

                // 3. 如果有 planId，查詢該計劃的最新版本
                if (planId) {
                    const latestVersion = await findLatestVersionByPlanId(planId, versionId);
                    if (latestVersion) {
                        targetData = latestVersion;
                        targetVersionId = latestVersion.versionId;
                        isLatest = false;
                        showVersionHint(`已為您跳轉至最新版本 (${new Date(latestVersion.timestamp).toLocaleDateString()})`);
                    }
                }

                // 4. 使用最終確定的版本資料
                currentPlan = targetData.planData;

                // 5. 合併匯率（優先使用備份中的匯率）
                if (targetData.exchangeRates && typeof targetData.exchangeRates === 'object') {
                    exchangeRates = { ...exchangeRates, ...targetData.exchangeRates };
                    console.log('✅ 已套用備份匯率:', exchangeRates);
                } else {
                    console.warn('⚠️ 此備份無匯率資料，使用預設匯率');
                }

                // 6. 隱藏載入、顯示內容
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('planContent').style.display = 'block';

                // 若已是最新，可顯示簡短提示（選用）
                if (isLatest && planId) {
                    showVersionHint('✔ 您正在檢視最新版本');
                }

                renderPlan();
            } catch (error) {
                console.error('載入分享計劃失敗:', error);
                showError('讀取資料時發生錯誤：' + error.message);
            }
        }

        function showError(msg) {
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('errorDetail').textContent = msg;
        }

        // ---------- 渲染計劃（以下完全沿用先前已修正版本）----------
        function renderPlan() {
            if (!currentPlan) return;

            document.getElementById('planName').textContent = currentPlan.name;
            const start = new Date(currentPlan.startDate);
            const end = new Date(start);
            end.setDate(start.getDate() + currentPlan.days - 1);
            document.getElementById('planDates').textContent = `${formatDate(start)} - ${formatDate(end)} (${currentPlan.days} 天)`;

            renderDaysTabs();
            showDay(1);
            renderCostContent();
        }

        function renderDaysTabs() {
            const tabsContainer = document.getElementById('daysTabs');
            const daysContent = document.getElementById('daysContent');
            tabsContainer.innerHTML = '';
            daysContent.innerHTML = '';

            for (let i = 1; i <= currentPlan.days; i++) {
                const tab = document.createElement('div');
                tab.className = `day-tab ${i === currentDay ? 'active' : ''}`;
                tab.textContent = `Day ${i}`;
                tab.dataset.day = i;
                tab.addEventListener('click', () => showDay(i));
                tabsContainer.appendChild(tab);

                const dayDiv = document.createElement('div');
                dayDiv.className = `day-content ${i === currentDay ? 'active' : ''}`;
                dayDiv.dataset.day = i;

                const dayTitle = currentPlan.dayTitles?.[i] || `第 ${i} 天`;
                const hasActivities = (currentPlan.activities || []).some(a => a.day === i);
                const mapBtn = hasActivities 
                    ? `<button class="btn btn-map-route" onclick="openDailyMapRoute(${i})"><i class="fas fa-map-marked-alt"></i> 查看地圖路線</button>`
                    : '';

                dayDiv.innerHTML = `
                    <div class="day-header">
                        <h4 class="day-title">${dayTitle}</h4>
                        ${mapBtn}
                    </div>
                    <div class="activities-container" data-day="${i}"></div>
                `;
                daysContent.appendChild(dayDiv);
            }

            const costTab = document.createElement('div');
            costTab.className = 'day-tab cost-tab';
            costTab.textContent = '費用';
            costTab.addEventListener('click', () => {
                document.querySelectorAll('.day-tab, .cost-tab').forEach(t => t.classList.remove('active'));
                costTab.classList.add('active');
                document.querySelectorAll('.day-content').forEach(c => c.classList.remove('active'));
                document.querySelectorAll('.cost-content').forEach(c => c.classList.add('active'));
            });
            tabsContainer.appendChild(costTab);

            const costDiv = document.createElement('div');
            costDiv.className = 'cost-content';
            costDiv.id = 'costContent';
            daysContent.appendChild(costDiv);
        }

        function showDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-tab').forEach(t => {
                t.classList.remove('active');
                if (parseInt(t.dataset.day) === day) t.classList.add('active');
            });
            document.querySelectorAll('.cost-tab').forEach(t => t.classList.remove('active'));

            document.querySelectorAll('.day-content').forEach(c => {
                c.classList.remove('active');
                if (parseInt(c.dataset.day) === day) c.classList.add('active');
            });
            document.querySelectorAll('.cost-content').forEach(c => c.classList.remove('active'));

            renderActivities(day);
        }

        function renderActivities(day) {
            const container = document.querySelector(`.activities-container[data-day="${day}"]`);
            if (!container) return;

            const dayActivities = (currentPlan.activities || []).filter(a => a.day === day);
            const dayTransports = (currentPlan.transports || []).filter(t => t.day === day);

            if (dayActivities.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">今日無行程安排</div>';
                return;
            }

            dayActivities.sort((a,b) => parseTime(a.startTime) - parseTime(b.startTime));
            container.innerHTML = '';

            dayActivities.forEach((act, idx) => {
                container.appendChild(createActivityElement(act));
                if (idx < dayActivities.length - 1) {
                    const next = dayActivities[idx+1];
                    const between = dayTransports.filter(t => t.fromActivityId === act.id && t.toActivityId === next.id);
                    between.forEach(t => container.appendChild(createTransportElement(t)));
                }
            });
        }

        function createActivityElement(activity) {
            const el = document.createElement('div');
            el.className = 'activity-item';

            const categoryLabels = { attraction:'景點', transport:'交通', activity:'活動', accommodation:'住宿', shopping:'購物', other:'其他' };
            const categoryClasses = { attraction:'attraction', transport:'transport', activity:'activity', accommodation:'accommodation', shopping:'shopping', other:'other' };

            const originalCost = activity.cost || 0;
            const currency = activity.currency || 'TWD';
            const rate = exchangeRates[currency] || 1;
            const twdCost = originalCost * rate;

            let linksHtml = '';
            if (activity.links && activity.links.length) {
                linksHtml = '<div class="activity-links">';
                activity.links.forEach(link => {
                    if (link.url) {
                        const url = link.url.startsWith('http') ? link.url : `https://${link.url}`;
                        linksHtml += `<a href="${url}" target="_blank"><i class="fas fa-external-link-alt"></i> ${link.name || '連結'}</a>`;
                    }
                });
                linksHtml += '</div>';
            }

            el.innerHTML = `<div class="activity-header">
                                <div>
                                    <span class="activity-name">${activity.name}</span>
                                    <span class="activity-category ${categoryClasses[activity.category]}">${categoryLabels[activity.category]}</span>
                                </div>
                                <div class="activity-time">${activity.startTime || ''} ${activity.endTime ? `- ${activity.endTime}` : ''}</div>
                            </div>
                            <div style="margin-bottom: 10px;">
                                <div><i class="fas fa-map-marker-alt"></i> ${activity.location}</div>
                                ${activity.address ? `<div class="activity-address"><i class="fas fa-map-pin"></i> ${activity.address}</div>` : ''}
                            </div>
                            <div class="activity-details">
                                ${originalCost > 0 ? `<div class="activity-cost"><i class="fas fa-money-bill-wave"></i> ${currency} ${originalCost.toFixed(2)} (${Math.round(twdCost)} TWD)</div>` : ''}
                                ${activity.notes ? `<div class="activity-notes"><i class="fas fa-sticky-note"></i> ${activity.notes}</div>` : ''}
                                ${linksHtml}
                            </div>`;
            return el;
        }

        function createTransportElement(transport) {
            const el = document.createElement('div');
            el.className = `transport-item ${transport.isMain ? 'transport-main' : 'transport-alternate'}`;

            const transportLabels = { taxi:'計程車', subway:'地鐵', bus:'公交', train:'高鐵', walking:'步行', flight:'飛機', ship:'輪船', coach:'巴士', selfdrive:'自駕', other:'其他' };
            const routeDesc = transport.fromLocation && transport.toLocation ? `${transport.fromLocation} → ${transport.toLocation}` : `${transport.fromActivityName} → ${transport.toActivityName}`;

            let totalCostTWD = 0, totalPersonalTWD = 0;
            if (transport.isMain && transport.options) {
                transport.options.forEach(opt => {
                    if (opt.isMain && opt.cost > 0) {
                        const rate = exchangeRates[opt.currency || 'TWD'] || 1;
                        const twd = opt.cost * rate;
                        const per = twd / (opt.participants || 1);
                        totalCostTWD += twd;
                        totalPersonalTWD += per;
                    }
                });
            }

            let optionsHtml = '';
            if (transport.options && transport.options.length) {
                transport.options.forEach(opt => {
                    const typeLabel = transportLabels[opt.type] || opt.type;
                    const isMainLabel = opt.isMain ? '✓ 主要' : '○ 次要';
                    const rate = exchangeRates[opt.currency || 'TWD'] || 1;
                    const twd = (opt.cost || 0) * rate;
                    optionsHtml += `<div style="margin: 8px 0; padding: 8px; background: white; border-radius: 4px; border-left: 3px solid ${opt.isMain ? '#4caf50' : '#ff9800'};">
                                        <div><strong>${typeLabel}</strong> <span style="color: ${opt.isMain ? '#4caf50' : '#ff9800'};">(${isMainLabel})</span></div>
                                        ${opt.cost > 0 ? `<div><i class="fas fa-money-bill-wave"></i> ${opt.currency || 'TWD'} ${opt.cost.toFixed(2)} (${twd.toFixed(2)} TWD) ${opt.participants > 1 ? `每人 ${(twd/(opt.participants||1)).toFixed(2)} TWD` : ''}</div>` : ''}
                                        ${opt.link && opt.linkName ? `<div><a href="${opt.link}" target="_blank"><i class="fas fa-link"></i> ${opt.linkName}</a></div>` : ''}
                                        ${opt.notes ? `<div><i class="fas fa-sticky-note"></i> ${opt.notes}</div>` : ''}
                                    </div>`;
                });
            }

            el.innerHTML = `<div style="margin-bottom: 10px;">
                                ${transport.isMain ? '<i class="fas fa-star" style="color: #4caf50;"></i> 主要' : '<i class="far fa-star" style="color: #ff9800;"></i> 備用'}
                            </div>
                            <div><i class="fas fa-clock"></i> ${transport.startTime} - ${transport.endTime}</div>
                            <div><i class="fas fa-route"></i> ${routeDesc}</div>
                            <div style="margin: 15px 0;">${optionsHtml}</div>
                            ${totalCostTWD > 0 ? `<div style="margin: 8px 0; padding: 10px; background: #e8f5e9; border-radius: 4px;"><i class="fas fa-money-bill-wave"></i> <strong>總費用: ${totalCostTWD.toFixed(2)} TWD</strong> <small>(每人 ${totalPersonalTWD.toFixed(2)} TWD)</small></div>` : ''}`;
            return el;
        }

        // ---------- 費用表格渲染（中文類別、正確匯率）----------
        function renderCostContent() {
            const costDiv = document.getElementById('costContent');
            if (!costDiv) return;

            const allCosts = getAllCosts(currentPlan);
            let html = `<div class="cost-summary">
                            <h3><i class="fas fa-calculator"></i> 費用列表</h3>
                            <div style="overflow-x: auto;">
                                <table class="cost-table">
                                    <thead>
                                        <tr><th>日期</th><th>類別</th><th>說明</th><th>幣別</th><th>原幣費用</th><th>換算台幣</th><th>分攤人數</th><th>每人費用(台幣)</th></tr>
                                    </thead>
                                    <tbody id="costTableBody"></tbody>
                                </table>
                            </div>
                        </div>`;
            costDiv.innerHTML = html;

            const tbody = document.getElementById('costTableBody');
            if (allCosts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 20px;">暫無費用記錄</td></tr>';
                return;
            }

            const catLabels = { 
                attraction:'景點', transport:'交通', activity:'活動', accommodation:'住宿', 
                shopping:'購物', other:'其他', food:'飲食', insurance:'保險', internet:'網路' 
            };

            const groups = {};
            allCosts.forEach(c => {
                if (!groups[c.date]) groups[c.date] = { title: formatDate(new Date(c.date)), items: [], totalTWD: 0 };
                groups[c.date].items.push(c);
            });

            Object.keys(groups).sort((a,b) => new Date(a) - new Date(b)).forEach(date => {
                const g = groups[date];
                g.items.sort((a,b) => (a.category || '').localeCompare(b.category || ''));
                g.items.forEach(c => {
                    const rate = exchangeRates[c.currency || 'TWD'] || 1;
                    g.totalTWD += c.amount * rate;
                });

                const headerRow = `<tr><td colspan="8" style="padding:0;"><div class="cost-group-header"><span>${g.title}</span><span>小計: ${g.totalTWD.toFixed(2)} TWD</span></div></td></tr>`;
                tbody.innerHTML += headerRow;

                g.items.forEach(c => {
                    const original = c.amount || 0;
                    const cur = c.currency || 'TWD';
                    const rate = exchangeRates[cur] || 1;
                    const twd = original * rate;
                    const participants = c.participants || 1;
                    const per = twd / participants;

                    let catText = '';
                    if (c.type === 'transport') {
                        catText = '交通';
                    } else {
                        catText = catLabels[c.category] || c.category;
                    }

                    let desc = '';
                    if (c.type === 'activity') desc = c.name;
                    else if (c.type === 'transport') desc = `${c.fromActivityName || ''} → ${c.toActivityName || ''}`;
                    else desc = c.description || '';

                    tbody.innerHTML += `<tr>
                                            <td>${formatDate(new Date(c.date))}</td>
                                            <td>${catText}</td>
                                            <td>${desc}</td>
                                            <td>${cur}</td>
                                            <td>${original.toFixed(2)}</td>
                                            <td>${twd.toFixed(2)}</td>
                                            <td>${participants}</td>
                                            <td class="total-cost">${per.toFixed(2)}</td>
                                        </tr>`;
                });
            });

            const totals = calculateTotalCosts(allCosts);
            tbody.innerHTML += `<tr class="cost-total-row">
                                    <td colspan="5"><strong>總計 (新台幣)</strong></td>
                                    <td><strong>${totals.totalTWD.toFixed(2)}</strong></td>
                                    <td></td>
                                    <td class="total-cost"><strong>${totals.totalPersonalTWD.toFixed(2)}</strong></td>
                                </tr>`;
        }

        function getAllCosts(plan) {
            const costs = [];
            if (plan.activities) plan.activities.forEach(a => {
                if (a.cost > 0) {
                    const d = new Date(plan.startDate);
                    d.setDate(d.getDate() + a.day - 1);
                    costs.push({ 
                        type:'activity', 
                        date: d.toISOString().split('T')[0], 
                        category: a.category, 
                        name: a.name, 
                        amount: a.cost, 
                        currency: a.currency||'TWD', 
                        participants: a.participants||1 
                    });
                }
            });
            if (plan.transports) plan.transports.forEach(t => {
                if (t.isMain && t.options) t.options.forEach(opt => {
                    if (opt.isMain && opt.cost > 0) {
                        const d = new Date(plan.startDate);
                        d.setDate(d.getDate() + t.day - 1);
                        costs.push({ 
                            type:'transport', 
                            date: d.toISOString().split('T')[0], 
                            category: opt.type, 
                            fromActivityName: t.fromActivityName, 
                            toActivityName: t.toActivityName, 
                            amount: opt.cost, 
                            currency: opt.currency||'TWD', 
                            participants: opt.participants||1 
                        });
                    }
                });
            });
            if (plan.additionalCosts) plan.additionalCosts.forEach(c => {
                costs.push({ 
                    type:'additional', 
                    date: c.date, 
                    category: c.category, 
                    description: c.description, 
                    amount: c.amount, 
                    currency: c.currency||'TWD', 
                    participants: c.participants||1 
                });
            });
            return costs;
        }

        function calculateTotalCosts(costs) {
            let total = 0, totalPer = 0;
            costs.forEach(c => {
                const rate = exchangeRates[c.currency||'TWD']||1;
                const twd = c.amount * rate;
                total += twd;
                totalPer += twd / (c.participants||1);
            });
            return { totalTWD: total, totalPersonalTWD: totalPer };
        }

        // ---------- 啟動 ----------
        loadSharedPlan();
    </script>
</body>
</html>
