<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅遊計劃規劃 - 路由</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4a6fa5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <p>載入中，請稍後...</p>
    </div>

    <script>
        // Firebase 設定（與編輯程式完全相同）
        const firebaseConfig = {
            apiKey: "AIzaSyAx25sF8HaBVULC4754V4UUS-5i6HtdY_c",
            authDomain: "travelplan-1f122.firebaseapp.com",
            databaseURL: "https://travelplan-1f122-default-rtdb.firebaseio.com",
            projectId: "travelplan-1f122",
            storageBucket: "travelplan-1f122.firebasestorage.app",
            messagingSenderId: "383887445959",
            appId: "1:383887445959:web:af118b60a90fb42fc453e2"
        };
        firebase.initializeApp(firebaseConfig);

        (async function() {
            // 取得 URL 參數
            const urlParams = new URLSearchParams(window.location.search);
            const shareParam = urlParams.get('share');  // 可能是 versionId

            // 判斷目前檔案名稱，用於決定編輯程式的路徑
            const currentPath = window.location.pathname;
            const baseDir = currentPath.substring(0, currentPath.lastIndexOf('/') + 1);
            const editPage = baseDir + 'EditPlan.html';
            const viewPage = baseDir + 'ViewPlan.html';

            if (!shareParam) {
                // 無分享代碼 -> 直接開啟編輯程式
                window.location.replace(editPage);
                return;
            }

            // 有分享代碼 -> 驗證該 versionId 是否存在於 Firebase
            try {
                const snapshot = await firebase.database().ref(`plan_versions/${shareParam}`).once('value');
                if (snapshot.exists()) {
                    // 存在，導向檢視程式，並帶入 versionId
                    window.location.replace(`${viewPage}?versionId=${shareParam}`);
                } else {
                    // 不存在，可能是無效連結，導向編輯程式並顯示提示
                    alert('無效的分享連結，將為您開啟編輯器。');
                    window.location.replace(editPage);
                }
            } catch (error) {
                console.error('驗證分享代碼失敗:', error);
                alert('連結驗證失敗，請稍後再試。');
                window.location.replace(editPage);
            }
        })();
    </script>
</body>
</html>
